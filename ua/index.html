<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📖 man.ua — Веб-Каталог українських Man-Pages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(56, 189, 248, 0.15);
      --card-hover: rgba(56, 189, 248, 0.25);
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.35);
      --accent: #34d399;
      --gold: #fbbf24;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --code-bg: #0b1120;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 0;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(52, 211, 153, 0.06) 0%, transparent 40%);
      background-attachment: fixed;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 30px 24px 80px 24px;
    }
    header {
      text-align: center;
      margin-bottom: 36px;
    }
    .badge-hero {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 16px;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 30%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 760px;
      margin: 0 auto 24px auto;
    }
    
    /* Search & Filter Controls */
    .controls {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 36px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      position: sticky;
      top: 16px;
      z-index: 50;
    }
    .search-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .search-input {
      flex: 1;
      background: var(--code-bg);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 1rem;
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--primary);
      color: #07090e;
      border-color: var(--primary);
      box-shadow: 0 0 12px var(--primary-glow);
    }

    /* Grid & Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }
    .man-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: all 0.25s ease;
    }
    .man-card:hover {
      border-color: var(--card-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .card-title-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .card-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--primary);
    }
    .card-sec-badge {
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }
    .card-summary {
      font-size: 0.92rem;
      color: #cbd5e1;
      text-align: justify;
      text-indent: 1.5ch;
      line-height: 1.55;
    }
    .code-box {
      background: var(--code-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: #7dd3fc;
      overflow-x: auto;
      white-space: pre-wrap;
      position: relative;
    }
    .copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn:hover {
      background: var(--primary);
      color: #000;
    }
    .card-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-read-md {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-read-md:hover {
      background: var(--primary);
      color: #07090e;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: #000;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 9999;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge-hero">🇺🇦 man.ua — Українська системна документація</div>
      <h1>Веб-Каталог Man-Pages</h1>
      <p class="subtitle">Інтерактивний довідник понад 34 000 посібників системної документації Linux з миттєвим пошуком та швидким копіюванням команд.</p>
    </header>

    <div class="controls">
      <div class="search-row">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Пошук по команді, призначенню чи синтаксису (наприклад: intro, grep, open, btrfs)..." autofocus>
      </div>
      <div class="filter-pills" id="filterContainer">
        <button class="filter-btn active" data-sec="all">⚡ Всі розділи (34 000+)</button>
        <button class="filter-btn" data-sec="1">💻 Розділ 1: Команди (4 566)</button>
        <button class="filter-btn" data-sec="2">🧠 Розділ 2: Системні виклики (1 077)</button>
        <button class="filter-btn" data-sec="3">📚 Розділ 3: Бібліотеки C (25 845)</button>
        <button class="filter-btn" data-sec="4">🔌 Розділ 4: Пристрої /dev (47)</button>
        <button class="filter-btn" data-sec="5">📑 Розділ 5: Конфігурації /etc (730)</button>
        <button class="filter-btn" data-sec="6">🎮 Розділ 6: Ігри (4)</button>
        <button class="filter-btn" data-sec="7">🌐 Розділ 7: Стандарти (763)</button>
        <button class="filter-btn" data-sec="8">🛡️ Розділ 8: Адміністрування (1 374)</button>
        <button class="filter-btn" data-sec="9">⚙️ Розділ 9: Ядро (1)</button>
      </div>
    </div>

    <div class="grid" id="cardsGrid"></div>
  </div>

  <div class="toast" id="toast">📋 Скопійовано в буфер обміну!</div>

імен", "synopsis": "int clone(int (*fn)(void *), void *stack, int flags, void *arg, ...);", "examples": "clone(child_fn, stack_top, CLONE_VM | CLONE_FS | SIGCHLD, NULL);", "alts": ["2", "fork", "unshare", "namespaces"], "sec_name": "Системні виклики ядра Linux", "icon": "🧠"}, {"sec": "3", "name": "printf", "summary": "Форматоване виведення тексту у стандартний потік (stdout)", "synopsis": "int printf(const char *format, ...);", "examples": "printf(\"Привіт, %s! Число: %d\\n\", \"Світ\", 42);", "alts": ["3", "sprintf", "snprintf", "fprintf"], "sec_name": "Бібліотечні виклики C / libc / Wayland API", "icon": "📚"}, {"sec": "3", "name": "malloc", "summary": "Динамічне виділення блоку пам'яті заданого розміру у купі (heap)", "synopsis": "void *malloc(size_t size);", "examples": "char *buf = (char *)malloc(1024);\nif (!buf) { /* помилка */ }\nfree(buf);", "alts": ["3", "free", "calloc", "realloc"], "sec_name": "Бібліотечні виклики C / libc / Wayland API", "icon": "📚"}, {"sec": "3", "name": "wl_display_connect", "summary": "Підключення клієнтського додатку до Wayland-композитора", "synopsis": "struct wl_display *wl_display_connect(const char *name);", "examples": "struct wl_display *dpy = wl_display_connect(NULL);", "alts": ["3", "wl_display_disconnect", "wayland"], "sec_name": "Бібліотечні виклики C / libc / Wayland API", "icon": "📚"}, {"sec": "4", "name": "null", "summary": "Нульовий пристрій скидання даних (/dev/null) та генератор нулів (/dev/zero)", "synopsis": "/dev/null, /dev/zero", "examples": "$ command > /dev/null 2>&1\n$ dd if=/dev/zero of=test.img bs=1M count=10", "alts": ["4", "zero", "random", "urandom"], "sec_name": "Спеціальні файли та пристрої (/dev)", "icon": "🔌"}, {"sec": "4", "name": "tty", "summary": "Керуючий термінальний пристрій поточного процесу (/dev/tty)", "synopsis": "/dev/tty", "examples": "$ echo \"Повідомлення на термінал\" > /dev/tty", "alts": ["4", "console", "pts"], "sec_name": "Спеціальні файли та пристрої (/dev)", "icon": "🔌"}, {"sec": "5", "name": "passwd", "summary": "Файл бази даних облікових записів користувачів системи (/etc/passwd)", "synopsis": "ім'я:пароль:UID:GID:GECOS:домашній_каталог:оболонка", "examples": "dusha:x:1000:1000:Andrey:/home/dusha:/usr/bin/fish", "alts": ["5", "shadow", "group"], "sec_name": "Формати конфігураційних файлів (/etc)", "icon": "📑"}, {"sec": "5", "name": "fstab", "summary": "Статична конфігурація точок монтування файлових систем (/etc/fstab)", "synopsis": "<накопичувач/UUID> <точка_монтування> <тип_ФС> <опції> <dump> <pass>", "examples": "UUID=xxxx-xxxx / btrfs subvol=@,compress=zstd:3 0 0", "alts": ["5", "mount", "crypttab"], "sec_name": "Формати конфігураційних файлів (/etc)", "icon": "📑"}, {"sec": "7", "name": "intro", "summary": "Вступ до загальних конвенцій, оглядів, мережевих стеків та стандартів", "synopsis": "man 7 intro", "examples": "$ man 7 intro\n$ man 7 hier\n$ man 7 tcp", "alts": ["7", "man-pages", "hier", "posix"], "sec_name": "Огляди, стандарти, конвенції та протоколи", "icon": "🌐"}, {"sec": "7", "name": "hier", "summary": "Опис структури та ієрархії стандартної файлової системи Linux/UNIX", "synopsis": "/, /bin, /etc, /usr, /var, /opt, /dev, /proc, /sys", "examples": "$ man 7 hier", "alts": ["7", "file-hierarchy", "pathname"], "sec_name": "Огляди, стандарти, конвенції та протоколи", "icon": "🌐"}, {"sec": "7", "name": "tcp", "summary": "Протокол керування передачею даних TCP (Transmission Control Protocol)", "synopsis": "TCP / IP v4/v6 протокол", "examples": "$ man 7 tcp\n$ man 7 ip\n$ man 7 socket", "alts": ["7", "ip", "udp", "socket"], "sec_name": "Огляди, стандарти, конвенції та протоколи", "icon": "🌐"}, {"sec": "8", "name": "systemctl", "summary": "Керування системним менеджером systemd та фоновими службами", "synopsis": "systemctl [OPTIONS...] COMMAND [UNIT...]", "examples": "$ sudo systemctl start docker\n$ systemctl status NetworkManager", "alts": ["8", "journalctl", "systemd"], "sec_name": "Команди системного адміністрування (Root)", "icon": "🛡️"}, {"sec": "8", "name": "btrfs", "summary": "Утиліта керування файловою системою Btrfs, підтомами та снапшотами", "synopsis": "btrfs <command> [<args>]", "examples": "$ sudo btrfs subvolume list /\n$ sudo btrfs filesystem df /", "alts": ["8", "snapper", "mkfs.btrfs"], "sec_name": "Команди системного адміністрування (Root)", "icon": "🛡️"}, {"sec": "8", "name": "iptables", "summary": "Адміністрування міжмережевого екрана IPv4 та фільтрація пакетів", "synopsis": "iptables [-t table] {-A|-D|-I} chain rule-specification", "examples": "$ sudo iptables -L -n -v\n$ sudo iptables -A INPUT -p tcp --dport 22 -j ACCEPT", "alts": ["8", "nft", "ufw", "firewalld"], "sec_name": "Команди системного адміністрування (Root)", "icon": "🛡️"}];
    let activeSec = 'all';

    function renderCards() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const grid = document.getElementById('cardsGrid');
      
      const filtered = CARDS_DATA.filter(item => {
        const matchSec = (activeSec === 'all' || item.sec === activeSec);
        const matchQuery = !query || 
          item.name.toLowerCase().includes(query) || 
          item.summary.toLowerCase().includes(query) || 
          item.synopsis.toLowerCase().includes(query);
        return matchSec && matchQuery;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted); font-size: 1.1rem;">🔍 Нічого не знайдено за вашим запитом. Спробуйте інше ключове слово.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="man-card">
          <div class="card-top">
            <div class="card-title-group">
              <span class="card-name">${item.name}</span>
              <span class="card-sec-badge">man ${item.sec}</span>
            </div>
            <span style="font-size: 0.8rem; color: var(--text-muted);">${item.icon} Розділ ${item.sec}</span>
          </div>

          <p class="card-summary">${item.summary}</p>

          <div style="font-size: 0.78rem; font-weight: 700; color: var(--gold); margin-top: 4px;">⚙️ СИНТАКСИС ВИКЛИКУ:</div>
          <div class="code-box">
            <button class="copy-btn" onclick="copyText('${escapeJs(item.synopsis)}')">📋 Копіювати</button>
            <code>${escapeHtml(item.synopsis)}</code>
          </div>

          <div style="font-size: 0.78rem; font-weight: 700; color: var(--accent); margin-top: 4px;">💡 ПРИКЛАД:</div>
          <div class="code-box">
            <button class="copy-btn" onclick="copyText('${escapeJs(item.examples)}')">📋 Копіювати</button>
            <code>${escapeHtml(item.examples)}</code>
          </div>

          <div class="card-footer">
            <span style="font-size: 0.78rem; color: var(--text-muted); font-family: monospace;">man/${item.name}.${item.sec}</span>
            <a href="man${item.sec}/${item.name}.${item.sec}.md" class="btn-read-md">📖 Відкрити .md →</a>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function escapeJs(str) {
      return str.replace(/\/g, '\\').replace(/'/g, "\'").replace(/\n/g, '\n');
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    // Filter Buttons
    document.getElementById('filterContainer').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeSec = btn.dataset.sec;
      renderCards();
    });

    // Search Input
    document.getElementById('searchInput').addEventListener('input', renderCards);

    // Initial render
    renderCards();
  </script>
</body>
</html>
